<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <title>Late Shift — Voice Survey</title>
  <style>
    :root { color-scheme: light dark; --line: #8883; }
    * { box-sizing: border-box; }
    body { margin: 0; font: 15px/1.5 system-ui, sans-serif; display: flex; flex-direction: column; height: 100dvh; }
    header { padding: 12px 16px; border-bottom: 1px solid var(--line); display: flex; gap: 12px; align-items: baseline; flex: 0 0 auto; }
    header b { font-size: 16px; } #status { color: #888; font-size: 13px; }
    main { display: grid; grid-template-columns: 1fr 1fr; gap: 0; flex: 1 1 auto; min-height: 0; }
    @media (max-width: 640px) { main { grid-template-columns: 1fr; grid-template-rows: 1fr 1fr; } }
    section { padding: 14px 16px; overflow: auto; }
    #left { border-right: 1px solid var(--line); }
    h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: #888; margin: 0 0 10px; }
    .field { display: flex; justify-content: space-between; gap: 12px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; margin-bottom: 8px; transition: background .3s; }
    .field.flash { background: #7c3aed22; }
    .qn { color: #888; font-size: 13px; } .qv { font-weight: 600; text-align: right; }
    .line { padding: 3px 0; } .line.user { color: #2563eb; } .line.agent { color: #7c3aed; }
    .line.ok { color: #16a34a; } .line.err { color: #dc2626; }
    #partial { color: #888; font-style: italic; min-height: 1.5em; }
    .bar { padding: 12px 16px; border-top: 1px solid var(--line); display: flex; gap: 10px; flex: 0 0 auto; }
    button { font: inherit; padding: 12px 18px; border-radius: 10px; border: 1px solid var(--line); background: #7c3aed; color: #fff; }
    button[disabled] { opacity: .4; }
    #talk { flex: 1; user-select: none; touch-action: none; }
    #talk.holding { background: #16a34a; }
    #start { background: #111; }
    select { font: inherit; padding: 12px; border-radius: 10px; border: 1px solid var(--line); background: transparent; color: inherit; }
  </style>
</head>
<body>
  <header><b>Late Shift</b><span>voice survey</span><span id="status">press Start</span></header>
  <main>
    <section id="left"><h2>Form</h2><div id="form"></div></section>
    <section><h2>Conversation</h2><div id="transcript"></div><div id="partial"></div></section>
  </main>
  <div class="bar">
    <select id="lang" title="Interview language">
      <option value="en">English (spoken)</option>
      <option value="es">Español (spoken)</option>
      <option value="hi">हिन्दी — understands, replies in English</option>
    </select>
    <button id="start">Start</button>
    <button id="talk" disabled>Hold to let respondent speak</button>
  </div>
  <script type="module" src="/client.ts"></script>
</body>
</html>

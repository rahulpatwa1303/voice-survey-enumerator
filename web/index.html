<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <title>Late Shift — Voice Survey</title>
  <style>
    :root { color-scheme: light dark; --line: #8883; }
    * { box-sizing: border-box; }
    body { margin: 0; font: 15px/1.5 system-ui, sans-serif; display: flex; flex-direction: column; height: 100dvh; }
    header { padding: 12px 16px; border-bottom: 1px solid var(--line); display: flex; gap: 12px; align-items: baseline; flex: 0 0 auto; }
    header b { font-size: 16px; } #status { color: #888; font-size: 13px; }
    main { display: grid; grid-template-columns: 1fr 1fr; gap: 0; flex: 1 1 auto; min-height: 0; }
    #tabs { display: none; }
    @media (max-width: 640px) {
      main { grid-template-columns: 1fr; grid-template-rows: 1fr; }
      #tabs { display: flex; flex: 0 0 auto; border-bottom: 1px solid var(--line); }
      #tabs button { flex: 1; background: transparent; color: inherit; border: 0; border-bottom: 2px solid transparent; border-radius: 0; padding: 12px; }
      #tabs button.on { border-bottom-color: #7c3aed; font-weight: 700; }
      #left { border-right: 0; }
      main > section { display: none; } main > section.show { display: block; }
      .bar { padding: 10px 12px; gap: 8px; }
      #lang { flex: 1 1 100%; }
      #start, #stop { flex: 1 1 0; }
      #talk { flex: 2 1 0; min-height: 60px; }
    }
    section { padding: 14px 16px; overflow: auto; }
    #left { border-right: 1px solid var(--line); }
    @media (max-width: 640px) { #left.show, #right.show { display: block; } }
    h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: #888; margin: 0 0 10px; }
    .field { display: flex; justify-content: space-between; gap: 12px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; margin-bottom: 8px; transition: background .3s; }
    .field.flash { background: #7c3aed22; }
    .qn { color: #888; font-size: 13px; } .qv { font-weight: 600; text-align: right; }
    .line { padding: 3px 0; } .line.user { color: #2563eb; } .line.agent { color: #7c3aed; }
    .line.ok { color: #16a34a; } .line.err { color: #dc2626; } .line.lat { color: #d97706; font-size: 12px; font-variant-numeric: tabular-nums; }
    #partial { color: #888; font-style: italic; min-height: 1.5em; }
    .bar { padding: 12px 16px; border-top: 1px solid var(--line); display: flex; gap: 10px; flex: 0 0 auto; flex-wrap: wrap; align-items: stretch; }
    button { font: inherit; padding: 12px 18px; border-radius: 10px; border: 1px solid var(--line); background: #7c3aed; color: #fff; }
    button[disabled] { opacity: .4; }
    #talk { flex: 1 1 140px; user-select: none; touch-action: none; }
    #start, #stop { flex: 0 0 auto; }
    select { flex: 1 1 140px; }
    #talk.holding { background: #16a34a; }
    #start { background: #111; }
    #stop { background: #dc2626; flex: 0 0 auto; }
    select { font: inherit; padding: 12px; border-radius: 10px; border: 1px solid var(--line); background: transparent; color: inherit; }
  </style>
</head>
<body>
  <header><b>Late Shift</b><span>voice survey</span><span id="status">press Start</span></header>
  <nav id="tabs">
    <button data-tab="left" class="on">Form</button>
    <button data-tab="right">Conversation</button>
  </nav>
  <main>
    <section id="left"><h2>Form</h2><div id="form"></div></section>
    <section id="right"><h2>Conversation</h2><div id="transcript"></div><div id="partial"></div></section>
  </main>
  <div class="bar">
    <select id="lang" title="Interview language">
      <option value="en">English (spoken)</option>
      <option value="es">Español (spoken)</option>
      <option value="hi">हिन्दी — understands, replies in English</option>
    </select>
    <button id="start">Start</button>
    <button id="talk" disabled>Hold to let respondent speak</button>
    <button id="stop" disabled>Stop</button>
  </div>
  <script>
    // Mobile tab switch between the Form and Conversation panels.
    const setTab = (t) => {
      document.querySelectorAll('#tabs button').forEach(b => b.classList.toggle('on', b.dataset.tab === t));
      document.getElementById('left').classList.toggle('show', t === 'left');
      document.getElementById('right').classList.toggle('show', t === 'right');
    };
    document.querySelectorAll('#tabs button').forEach(b => b.addEventListener('click', () => setTab(b.dataset.tab)));
    setTab('left');
  </script>
  <script type="module" src="/client.ts"></script>
</body>
</html>
